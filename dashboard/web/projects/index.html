<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hestia · Projects</title>
  <link rel="stylesheet" href="/board.css">
  <link rel="stylesheet" href="/projects/projects.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
</head>
<body>
  <aside id="side">
    <div class="brand">Hestia</div>
    <button id="new"><i>+</i>New project</button>
    <ul id="list"></ul>
    <div id="grip" title="Drag to resize"></div>
  </aside>

  <main id="start">
    <div class="hero">
    <div class="hero-name">Hestia</div>
    <h1>What would you like to <span class="build">build<svg viewBox="0 0 120 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 10 C 30 3, 70 2, 117 7"/></svg></span>?</h1>
    <form id="start-form">
      <textarea id="start-text" rows="4" data-suggest placeholder="A red LED with a 1 kΩ resistor on 5 V"></textarea>
      <button class="primary create">Create<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5v7a3 3 0 0 1-3 3H5m0 0 4-4m-4 4 4 4"/></svg></button>
    </form>
    <div id="ideas"></div>
    </div>
  </main>

  <main id="project" hidden>
    <section class="pane" id="p-circuit"><h2>Circuit</h2><div class="card"><svg id="schematic"></svg></div></section>
    <section class="pane" id="p-board">
      <h2>Breadboard <span id="board-tools"></span></h2>
      <div class="card scroll"><svg id="board"></svg></div>
      <div id="board-foot"></div>
    </section>
    <section class="pane" id="p-progress" hidden><h2>Construction</h2><div id="progress"></div></section>
    <section class="pane" id="p-chat">
      <h2 id="title"></h2>
      <div id="thread"></div>
      <div id="work" hidden></div>
      <div id="actions"></div>
      <form id="chat-form">
        <textarea id="chat-text" rows="2" placeholder="Change something"></textarea>
        <button class="primary" id="send">Send</button>
      </form>
    </section>
  </main>
  <script type="module" src="/projects/projects.js"></script>
</body>
</html>
