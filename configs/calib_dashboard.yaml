# Camera + UR3e calibration dashboard (dashboard/server.py)
port: 8090
state_hz: 10
stream_width: 960          # JPEG width sent to the browser
stream_hz: 30              # camera feeds to the browser
detect_hz: 3               # live board detection (fast, downscaled); samples use full accuracy
cloud_hz: 2
cloud_stride: 4
cloud_outlier_k: 8           # statistical outlier removal: neighbours per point
cloud_outlier_std: 2.0       # drop points this many sigmas sparser than average (0 = off)

robot:
  bridge_url: https://192.168.2.12/universal-robots/ai-agent-bridge/mcp/v1/
  poll_s: 0.05             # FK uses the controller's DH table (bridge), nominal as fallback

# Checkerboard in the middle of the table. Inner corners, not squares.
# It defines the world: origin at the board centre, x along the columns, z up.
# 15.2 mm squares: best fit of the gripper-cam sweep (2026-10-24).
board:
  cols: 8
  rows: 7
  square: 0.0152
  thickness: 0.004          # plate top above the table (gripper-cam depth); the T Mini's ToF reads it ~2 mm high

fixed_camera:              # RealSense D435 above the table
  label: Fixed D435
  model: RealSense D435     # name on the view buttons and 3D labels
  serial: "818312071128"
  modes: [[1280, 720, 30], [1280, 720, 10], [1280, 720, 6], [640, 480, 30]]   # first that works; on USB 2, 720p only at 10/6 fps
  depth_hz: 5              # depth aligned to color this often (point cloud, base alignment)

gripper_camera:            # Orbbec Gemini 335Lg on the gripper, color over UVC
  label: Gripper Gemini 335Lg
  model: Gemini 335Lg
  match: Orbbec            # first Orbbec V4L2 node that streams YUYV (was /dev/video6)
  size: [1280, 720]
  fps: 30
  hfov_deg: 86             # intrinsics guess for plain UVC only (the Orbbec SDK gives factory ones)
  # flange -> camera optical frame [rx, ry, rz (rotvec), x, y, z (m)]. Gripper cam
  # pose = base · FK · mount. From the 0.42 px hand-eye of 2026-10-24.
  mount: [-0.0394, 0.0074, 0.0134, -0.0401, 0.1149, 0.0997]

tof_camera:                # SICK Visionary-T Mini AP (ToF, no colour) on enP7p1s0f2, Nova app over HTTP
  label: SICK T Mini
  model: Visionary-T Mini
  ip: 192.168.136.1        # its own address (not the documented 192.168.1.10); Jetson side 192.168.136.100/24
  hz: 15                   # Nova heightmap polls; a frame is ~0.9 MB of JSON, ~65 ms to fetch, so ~15 is the ceiling
  timeout_s: 2.0
  cloud_stride: 1          # 512x424 grid, mostly empty outside Nova's working range
  # pose: T_world_tcam in scene_file once calibrated (not yet: test position)

# Experiments tab: results folders to choose from (the first is the default). The two
# checkouts keep running their own experiments; each folder has its own video cache.
experiments:
  main: {dir: results, cache: data/cache/experiments}
  shao: {dir: /home/lab/dev/shao/order2cobot/results, cache: data/cache/experiments-shao}

scene_file: configs/calibration/scene.yaml   # base x/y/yaw + fixed cam pose, written by the dashboard

# Switch port QA (dashboard Port QA tab, dashboard/check_link.py). The robot
# moves the cable from this Jetson port between the switch's ports.
qa:
  iface: enP7p1s0f0
  ports: 8
  timeout_s: 6.0           # time for the link to come up / drop
  stable_s: 1.0            # the link must hold this long
  min_speed: 1000          # Mb/s; 100 usually means a bad crimp or a half-seated plug
  results_file: data/qa/ports.json

simulation:                # Simulation tab: the simulated UR3e + bridge (python -m simulation)
  url: http://127.0.0.1:8095
