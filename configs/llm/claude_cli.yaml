# Claude through the logged-in `claude` CLI: uses its claude.ai login, no API key
# (run `claude` once and log in; ANTHROPIC_API_KEY is ignored for this provider)
provider: claude_cli
model: claude-opus-5-5
client_name: claude-cli-task-builder # connection name on the pendant; give it Adjust access
params:                              # ClaudeAgentOptions fields, passed as-is
  effort: high
