id: tool-length-sign
title: a top contact BELOW the scene top means the tool is SHORTER
applies_to:
- locate_step
- tool_model
symptom: null
cause: 'fingertip length from a top touch: L_real = L_used - (top_scene - z_contact); the sign was flipped once
  (0.2821 instead of 0.2269), so the robot stayed ~55 mm higher than it believed'
fix: 'touch_locate.fingertip_from_top (fixed); sanity: the commanded tip height vs what the operator sees; guarded
  descents only until the tool is measured'
