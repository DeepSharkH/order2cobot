id: grasp-offset-half-pitch
title: a grasp offset over half a pitch puts the part one hole off, and the search calls it success
applies_to:
- insert_step
- grasp_step
symptom: null
cause: 'MISS: legs in j19/j21, target j20/j22 (one row towards the robot). Cause: the LED legs sat ~+1.95 mm (towards
  row 1, +x base) from the fingertip TCP - more than half a pitch (1.27 mm) - so the search started closer to the
  neighbouring pair and the first ring peck (+0.7 mm x) dropped into it. The peck search accepts ANY hole pair,
  so it reported success. y matched the jumper runs (-0.94 vs -0.95): board model fine. Sources (user): imprecise
  grip of the 14 mm LED casing on the 5 mm finger, and the custom finger is not snug on the Hand-E (it can tilt
  sideways). Found by the operator reading the holes, not by the agent.'
fix: 'measure the legs under the TCP per grasp before the search, coarse is enough (< +-1.27 mm): push the casing
  against a known face (board row-1 end) at <= 1.5 N, legs from casings.json exit_x; then the peck drop gives the
  fine position. Verify the hole pair afterwards (camera / operator) until the calibration is validated. Bias: the
  jumper (11.5 mm casing, carefully centred) never showed it'
status: proposed
validated_by: []
seen_in:
- place_probe_20261027-121451 (LED led_s2, j19/j21 for j20/j22)
stamp: '2026-10-27'
