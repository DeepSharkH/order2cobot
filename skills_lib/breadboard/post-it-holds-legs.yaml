id: post-it-holds-legs
title: the post-it holds the legs with ~3-4 N, a 3 N pull stop calls a clean pick "caught"
applies_to:
- pick_step
symptom: 'pull_out from rack slot R4 (led_s2, legs pushed through the post-it by hand) stopped at 3.07 N after
  0.16 mm; cameras: casing gripped and upright, post-it flat, nothing caught'
cause: the paper grips the two legs it was pierced by; the skill's 3 N "a leg is caught" stop was a guess without
  a measurement
fix: 'pull stop 8 N (rack_pick --pull-stop 8; cap 20 N): pulled 30 mm, peak 4.06 N, legs out, post-it stayed flat
  with two holes. Keep the 3 N default until a second pick confirms the peak, then raise it'
status: proposed
validated_by: []
seen_in:
- rack_pick_20261027-142033 (3.07 N stop at 0.16 mm; then 8 N stop, peak 4.06 N, pulled)
stamp: '2026-10-27'
